<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>{{ page.title }} — ZynAyush</title>
<link rel="stylesheet" href="{{ '/docs-shell.css?v=20261118-full-site' | relative_url }}"/>
</head>
<body>
<div class="site-sidebar-backdrop" data-sidebar-backdrop hidden></div>
<aside class="site-sidebar" id="site-sidebar" aria-label="Site navigation" aria-hidden="true">
<div class="sidebar-head"><button class="sidebar-close" type="button" data-sidebar-close aria-label="Close navigation">×</button></div>
</aside>
<header class="site-header">
<button class="sidebar-open" type="button" data-sidebar-open aria-controls="site-sidebar" aria-expanded="false">☰</button>
<button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch theme"><span class="theme-toggle-icon">☾</span></button>
</header>
<div class="site-language-bar">
<div class="site-language-inner">
<span class="language-caption">LANGUAGE</span>
<label class="visually-hidden" for="site-language-select">Translate this page</label>
<select id="site-language-select" aria-label="Choose page language">
<option value="">Translate this page…</option>
<option value="hi">हिन्दी · Hindi</option><option value="bn">বাংলা · Bengali</option>
<option value="ur">اردو · Urdu</option><option value="es">Español · Spanish</option>
<option value="fr">Français · French</option><option value="de">Deutsch · German</option>
<option value="pt">Português · Portuguese</option><option value="ja">日本語 · Japanese</option>
<option value="ko">한국어 · Korean</option><option value="zh-CN">简体中文 · Chinese</option>
<option value="ar">العربية · Arabic</option><option value="ru">Русский · Russian</option>
</select>
<button class="translate-page-button" data-translate-page type="button">TRANSLATE ↗</button>
<small>Translation uses Google Translate, so the wording may differ from the original.</small>
</div>
</div>
<main class="doc-wrap docs-markdown-page">
<div class="doc-top"><a href="{{ '/docs/' | relative_url }}">← DOCUMENTATION</a><span class="eyebrow">PROJECT REFERENCE</span></div>
{{ content }}
</main>
<footer class="footer"><span>© ZynAyush</span><span>Independent Minecraft projects.</span></footer>
<script src="{{ '/theme.js?v=20261118-full-site' | relative_url }}"></script>
<script src="{{ '/site-ui.js?v=20261118-full-site' | relative_url }}"></script>
<script src="{{ '/docs-shell.js?v=20261118-full-site' | relative_url }}"></script>
</body>
</html>
